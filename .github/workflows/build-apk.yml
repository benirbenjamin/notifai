name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Notifai space Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: ⚙️ Generate Android Native Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install

      - name: 🔨 Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifai-space-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
